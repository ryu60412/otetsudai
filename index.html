<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おてつだい">
<meta name="theme-color" content="#FF9800">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>おてつだいポイント</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:linear-gradient(135deg,#FFF8E1,#FFECB3);}

/* Setup */
#setup{position:fixed;inset:0;background:linear-gradient(135deg,#E1F5FE,#FFF8E1);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
#setup h1{font-size:2em;color:#E65100;}
#setup p{font-size:1.15em;color:#555;}
.ni{font-size:1.3em;padding:12px 18px;border:3px solid #FFB74D;border-radius:14px;text-align:center;width:75%;max-width:300px;outline:none;background:#fff;}
.ni:focus{border-color:#FF9800;box-shadow:0 0 8px rgba(255,152,0,.3);}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cb{font-size:2.4em;width:92px;height:92px;border:4px solid #FFB74D;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;box-shadow:0 3px 10px rgba(0,0,0,.1);}
.cb span{font-size:.3em;margin-top:2px;}
.cb:active,.cb.sel{transform:scale(.92);background:#FFF3E0;border-color:#FF9800;}
.cb.sel{border-width:5px;box-shadow:0 0 12px rgba(255,152,0,.4);}
.sg{padding:14px 44px;font-size:1.4em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF7043,#F4511E);border:none;border-radius:44px;cursor:pointer;box-shadow:0 4px 12px rgba(244,81,30,.4);margin-top:6px;}
.sg:disabled{background:#ccc;box-shadow:none;}

/* Main */
#main{display:none;width:100%;height:100%;overflow:hidden;}
.top{background:linear-gradient(90deg,#FF9800,#FFA726);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);flex-shrink:0;}
.top .tc{font-size:1.6em;}
.top .tn{font-size:1em;font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top .tp{font-size:1.6em;font-weight:bold;}
.top .tl{font-size:.8em;opacity:.9;margin-right:2px;}
.tbtn{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:.82em;padding:5px 10px;border-radius:18px;cursor:pointer;white-space:nowrap;font-weight:bold;}
.tbtn:active{background:rgba(255,255,255,.4);}

/* Grid layout */
.wrap{display:flex;flex:1;overflow:hidden;height:calc(100% - 52px);}
.col-l{flex:1.1;display:flex;flex-direction:column;overflow:hidden;border-right:2px solid #FFE0B2;}
.col-r{flex:0.9;display:flex;flex-direction:column;overflow:hidden;}

/* Progress */
.pbar-w{margin:8px 12px;background:#fff;border-radius:14px;height:22px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);flex-shrink:0;}
.pbar{height:100%;background:linear-gradient(90deg,#66BB6A,#43A047);border-radius:14px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:bold;font-size:.75em;min-width:30px;}

/* Board */
.bwrap{flex:1;overflow-y:auto;padding:6px 12px 12px;-webkit-overflow-scrolling:touch;}
.bwrap h3{text-align:center;font-size:1.05em;color:#E65100;margin-bottom:6px;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:420px;margin:0 auto;}
.cell{width:100%;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.15em;font-weight:bold;position:relative;transition:.3s;border:2px solid transparent;line-height:1.1;}
.cell.done{background:#C8E6C9;color:#388E3C;border-color:#81C784;}
.cell.current{background:linear-gradient(135deg,#42A5F5,#1E88E5);color:#fff;border-color:#1565C0;animation:pulse 1s infinite;font-size:1.4em;box-shadow:0 0 10px rgba(33,150,243,.5);}
.cell.goal{background:linear-gradient(135deg,#FFD54F,#FFC107);color:#E65100;border-color:#FFB300;font-size:1.3em;}
.cell.milestone{background:linear-gradient(135deg,#FFD54F,#FFAB00);color:#E65100;border-color:#FF8F00;animation:sparkle 2s infinite;}
.cell.milestone .ml{font-size:.26em;margin-top:1px;opacity:.85;white-space:nowrap;}
.cell.future{background:#FAFAFA;color:#BDBDBD;border-color:#E0E0E0;}
.cell .cn{position:absolute;top:1px;left:4px;font-size:.38em;opacity:.6;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
@keyframes sparkle{0%,100%{box-shadow:0 0 4px rgba(255,143,0,.3);}50%{box-shadow:0 0 12px rgba(255,143,0,.6);}}

/* Chore panel */
.cpan{flex:1;overflow-y:auto;padding:8px 10px;-webkit-overflow-scrolling:touch;}
.cpan h3{text-align:center;font-size:1.05em;color:#E65100;margin-bottom:8px;}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.chore{border:3px solid #FFB74D;border-radius:16px;background:#fff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.08);position:relative;min-height:80px;}
.chore:active{transform:scale(.93);background:#FFF3E0;}
.chore .ce{font-size:1.8em;}
.chore .cn2{font-size:.82em;font-weight:bold;color:#333;margin-top:3px;}
.chore .badge{position:absolute;top:-6px;right:-6px;background:#F4511E;color:#fff;font-size:.72em;font-weight:bold;padding:3px 8px;border-radius:12px;box-shadow:0 2px 6px rgba(244,81,30,.4);}

/* Undo & Morning */
.bot-r{flex-shrink:0;padding:8px 10px;border-top:2px solid #FFE0B2;}
.undo-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ubtn{flex:1;padding:8px;font-size:.95em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#78909C,#546E7A);border:none;border-radius:20px;cursor:pointer;}
.ubtn:disabled{background:#ccc;}
.ucmsg{color:#EF5350;font-size:.8em;font-weight:bold;animation:blink .6s 3;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.morn{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-radius:14px;padding:10px;text-align:center;}
.morn h4{color:#1565C0;font-size:1em;margin-bottom:4px;}
.morn .mt{font-size:.85em;color:#1565C0;font-weight:bold;}
.mbtn{padding:8px 24px;font-size:1em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#42A5F5,#1E88E5);border:none;border-radius:20px;cursor:pointer;margin-top:6px;}
.mbtn:disabled{background:#B0BEC5;}

/* Animations */
.pt-anim{position:fixed;font-size:1.8em;font-weight:bold;pointer-events:none;z-index:999;animation:floatUp 1.3s ease forwards;text-align:center;white-space:nowrap;}
.pt-anim.plus{color:#FF5722;}
.pt-anim.minus{color:#1E88E5;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-100px) scale(1.3);}}
.milestone-toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(60px);background:linear-gradient(135deg,#FFF8E1,#FFE082);border:3px solid #FFB300;border-radius:20px;padding:14px 24px;text-align:center;z-index:1800;box-shadow:0 8px 25px rgba(255,143,0,.35);animation:toastIn .4s ease forwards;min-width:240px;max-width:80%;}
.milestone-toast.out{animation:toastOut .4s ease forwards;}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(60px) scale(.8);}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes toastOut{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.9);}}
.milestone-toast .mtc{font-size:2em;}
.milestone-toast .mtm{font-size:1.2em;font-weight:bold;color:#E65100;margin-top:3px;}
.milestone-toast .mtp{font-size:.9em;color:#888;margin-top:2px;}

/* Confetti */
.cfw{position:fixed;inset:0;pointer-events:none;z-index:2000;overflow:hidden;}
.cf{position:absolute;width:10px;height:10px;border-radius:2px;animation:cfFall 3s ease-in forwards;}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* Modals */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;display:flex;align-items:center;justify-content:center;padding:16px;}
.md{background:#fff;border-radius:22px;padding:24px 20px;text-align:center;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:mdIn .3s ease;max-height:85vh;overflow-y:auto;}
@keyframes mdIn{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.md h2{font-size:1.5em;color:#E65100;margin-bottom:8px;}
.md .be{font-size:3.5em;margin:6px 0;}
.md p{font-size:1em;color:#555;margin:5px 0;}
.md button{margin-top:10px;padding:10px 30px;font-size:1.1em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#66BB6A,#43A047);border:none;border-radius:30px;cursor:pointer;}
.cbts{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.cbts button{padding:10px 24px;font-size:1.05em;font-weight:bold;border:none;border-radius:24px;cursor:pointer;}
.cbts .yb{background:#ef5350;color:#fff;}
.cbts .nb{background:#E0E0E0;color:#555;}
.cbts .gb{background:#43A047;color:#fff;}

/* Settings specifics */
.scard{background:#F5F5F5;border-radius:14px;padding:16px;margin:10px 0;text-align:left;}
.scard h3{color:#E65100;font-size:1.1em;margin-bottom:8px;}
.scard label{display:block;font-size:.95em;color:#555;margin-bottom:4px;}
.sw{display:flex;align-items:center;gap:8px;}
.sw input[type=range]{flex:1;height:6px;-webkit-appearance:none;background:#FFE0B2;border-radius:3px;outline:none;}
.sw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#FF9800;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.2);cursor:pointer;}
.sv{font-size:1.3em;font-weight:bold;color:#E65100;min-width:40px;text-align:center;}
.ts{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap;}
.ts select{font-size:1em;padding:6px 10px;border:2px solid #BBDEFB;border-radius:8px;background:#fff;color:#333;}
.ts span{font-size:1em;color:#555;}
.pl{list-style:none;padding:0;margin:8px 0;}
.pl li{display:flex;align-items:center;gap:10px;padding:10px;margin:5px 0;background:#FFF8E1;border-radius:10px;font-size:1em;cursor:pointer;border:2px solid transparent;}
.pl li.cur{border-color:#FF9800;background:#FFF3E0;}
.pl li .pc{font-size:1.3em;}.pl li .pn{flex:1;font-weight:bold;}.pl li .pp{color:#E65100;font-weight:bold;}
.db{background:#ef5350;color:#fff;border:none;padding:4px 12px;border-radius:8px;font-size:.8em;cursor:pointer;font-weight:bold;}
.abtn{width:100%;padding:10px;font-size:1em;font-weight:bold;color:#fff;background:#43A047;border:none;border-radius:10px;cursor:pointer;margin-top:4px;}
.rbtn{width:100%;padding:10px;font-size:1em;font-weight:bold;color:#fff;background:#e53935;border:none;border-radius:10px;cursor:pointer;margin-top:4px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.toggle-row span{font-size:1em;color:#333;}
.toggle{width:50px;height:28px;border-radius:14px;background:#ccc;position:relative;cursor:pointer;transition:.3s;}
.toggle.on{background:#66BB6A;}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on::after{left:25px;}

/* Chore editor in settings */
.ce-item{display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;background:#fff;border-radius:10px;border:1px solid #eee;}
.ce-item .ce-emoji{font-size:1.4em;width:36px;text-align:center;}
.ce-item .ce-name{flex:1;font-size:.9em;font-weight:bold;}
.ce-item .ce-pt{font-size:.85em;color:#E65100;font-weight:bold;min-width:30px;text-align:center;}
.add-chore-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.add-chore-row input,.add-chore-row select{font-size:.95em;padding:6px 8px;border:2px solid #FFE0B2;border-radius:8px;background:#fff;}
.add-chore-row input{flex:1;min-width:80px;}

/* Portrait fallback */
@media (max-aspect-ratio:1/1){
  .wrap{flex-direction:column;}
  .col-l{border-right:none;border-bottom:2px solid #FFE0B2;flex:1;}
  .col-r{flex:1;}
}
</style>
</head>
<body>

<div id="setup">
  <h1>&#x1F31F; おてつだいポイント &#x1F31F;</h1>
  <p>なまえと キャラクターを えらんでね！</p>
  <input type="text" class="ni" id="sName" placeholder="なまえを いれてね" maxlength="10">
  <div class="cg" id="sChars"></div>
  <button class="sg" id="sGo" onclick="finishSetup()" disabled>はじめる！</button>
</div>

<div id="main">
  <div class="top">
    <span class="tc" id="tC"></span>
    <span class="tn" id="tN"></span>
    <span class="tl">ポイント</span>
    <span class="tp" id="tP">0</span>
    <button class="tbtn" onclick="showSwitch()">&#x1F465;きりかえ</button>
    <button class="tbtn" onclick="showSettings()">⚙️</button>
  </div>
  <div class="wrap">
    <div class="col-l">
      <div class="pbar-w"><div class="pbar" id="pBar" style="width:0%">0%</div></div>
      <div class="bwrap">
        <h3>&#x1F5FA;&#xFE0F; ぼうけんマップ</h3>
        <div class="board" id="board"></div>
      </div>
    </div>
    <div class="col-r">
      <div class="cpan" id="cpan">
        <h3>⭐ おてつだいを えらんでね</h3>
        <div class="cgrid" id="choreGrid"></div>
      </div>
      <div class="bot-r">
        <div class="undo-row">
          <button class="ubtn" id="uBtn" onclick="undoPoint()">⏪ もどす（-1）</button>
          <span class="ucmsg" id="uMsg" style="display:none">もう1かい タップ</span>
        </div>
        <div class="morn" id="mornBox">
          <h4>☀️ あさチャレンジ <span id="mTime"></span></h4>
          <button class="mbtn" id="mBtn" onclick="mornChallenge()">☀️ おきたよ！（+2）</button>
          <div class="mt" id="mStat"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="mw"></div>

<script>
// ===== Audio =====
var actx=null;
function ensureAudio(){if(!actx)try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playTone(freq,dur,type,vol){
  ensureAudio();if(!actx||D.muteS)return;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.15,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
}
function seTap(pts){var f=pts===1?880:pts===2?988:1047;playTone(f,.15,'sine',.18);setTimeout(function(){playTone(f*1.25,.12,'sine',.12);},80);}
function seUndo(){playTone(600,.1,'sine',.12);setTimeout(function(){playTone(400,.15,'sine',.1);},80);}
function seMilestone(){var ns=[880,1047,1319];for(var i=0;i<ns.length;i++)(function(j){setTimeout(function(){playTone(ns[j],.2,'sine',.15);},j*100);})(i);}
function seGoal(){var ns=[784,988,1175,1319,1568];for(var i=0;i<ns.length;i++)(function(j){setTimeout(function(){playTone(ns[j],.25,'triangle',.18);},j*120);})(i);}
// BGM
var bgmOn=false,bgmInt=null;
var bgmNotes=[392,440,523,587,659,523,587,440,392,523,587,659,784,659,587,523];
var bgmIdx=0;
function startBGM(){
  if(bgmOn||D.muteB)return;ensureAudio();if(!actx)return;bgmOn=true;bgmIdx=0;
  bgmInt=setInterval(function(){
    if(D.muteB){stopBGM();return;}
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=bgmNotes[bgmIdx%bgmNotes.length];
    g.gain.setValueAtTime(.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.35);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.4);
    bgmIdx++;
  },380);
}
function stopBGM(){bgmOn=false;if(bgmInt){clearInterval(bgmInt);bgmInt=null;}}

// ===== Data =====
var CHARS=['\uD83D\uDE97','\uD83D\uDE92','\uD83D\uDE93','\uD83D\uDC30','\uD83D\uDC31','\uD83D\uDC3C'];
var DEF_CHORES=[
  {emoji:'\uD83E\uDDF9',name:'おかたづけ',pt:1},{emoji:'\uD83E\uDDB7',name:'はみがき',pt:1},
  {emoji:'\uD83D\uDEC1',name:'おふろそうじ',pt:2},{emoji:'\uD83C\uDF73',name:'おりょうり てつだい',pt:2},
  {emoji:'\uD83D\uDC55',name:'せんたくもの たたみ',pt:1},{emoji:'\uD83C\uDF31',name:'おはなに みずやり',pt:1},
  {emoji:'\uD83D\uDC15',name:'ペットの おせわ',pt:2},{emoji:'\uD83D\uDCDA',name:'おべんきょう',pt:2},
  {emoji:'✨',name:'そのほか',pt:1}
];
var EMOJIS=['\uD83E\uDDF9','\uD83E\uDDB7','\uD83D\uDEC1','\uD83C\uDF73','\uD83D\uDC55','\uD83C\uDF31','\uD83D\uDC15','\uD83D\uDCDA','✨','\uD83C\uDF5A','\uD83D\uDEBF','\uD83D\uDECD','\uD83D\uDCDD','\uD83C\uDFB5','\uD83C\uDFC3','\uD83D\uDE4F','\uD83D\uDCA4','\uD83D\uDC56','\uD83E\uDDFA','\uD83E\uDDED','⭐','\uD83C\uDF1F','\uD83D\uDD25'];
var D={players:[],currentId:null,target:30,mStart:{h:6,m:0},mEnd:{h:7,m:30},chores:DEF_CHORES.slice(),muteS:false,muteB:false};
var undoP=false,undoT=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cur(){for(var i=0;i<D.players.length;i++)if(D.players[i].id===D.currentId)return D.players[i];return null;}
function save(){localStorage.setItem('ot4',JSON.stringify(D));}
function load(){var s=localStorage.getItem('ot4');if(s)try{D=JSON.parse(s);if(!D.chores||!D.chores.length)D.chores=DEF_CHORES.slice();}catch(e){}}

// ===== Milestones =====
function msMsg(p,t){
  var r=t-p;if(r<=10&&r>0)return{msg:'あとちょっと！',e:'\uD83D\uDCA8'};if(r<=0)return null;
  var m={10:{msg:'いいかんじ！',e:'\uD83C\uDF1F'},20:{msg:'がんばってるね！',e:'\uD83D\uDCAA'},30:{msg:'すごいぞ！',e:'⭐'},40:{msg:'えらい！',e:'\uD83D\uDC4F'},50:{msg:'はんぶん すぎたよ！',e:'\uD83C\uDFAF'},60:{msg:'もっと いけるよ！',e:'\uD83D\uDD25'},70:{msg:'あとちょっと！',e:'\uD83D\uDCA8'},80:{msg:'もうすぐ ゴール！',e:'\uD83C\uDFC1'},90:{msg:'ラストスパート！',e:'\uD83D\uDE80'}};
  return m[p]||{msg:'その ちょうし！',e:'✨'};
}
function msLabel(n,t){var r=t-n;if(r<=10&&r>0)return 'あとちょっと';var l={10:'いいかんじ',20:'がんばれ',30:'すごい',40:'えらい',50:'はんぶん',60:'いけるよ',70:'あとすこし',80:'もうすぐ',90:'ラスト'};return l[n]||'ファイト';}
function showToast(pts,t){var info=msMsg(pts,t);if(!info)return;var p=cur();var el=document.createElement('div');el.className='milestone-toast';el.innerHTML='<div class="mtc">'+(p?p.char:'⭐')+'</div><div class="mtm">'+info.e+' '+info.msg+' '+info.e+'</div><div class="mtp">'+pts+'ポイント たっせい！</div>';document.body.appendChild(el);setTimeout(function(){el.classList.add('out');},2000);setTimeout(function(){el.remove();},2500);}

// ===== Init =====
function init(){
  load();buildCharBtns();
  if(D.players.length&&D.currentId){document.getElementById('setup').style.display='none';document.getElementById('main').style.display='flex';renderAll();}
  document.getElementById('sName').addEventListener('input',chkSetup);
  document.body.addEventListener('click',function(){ensureAudio();if(!D.muteB&&!bgmOn)startBGM();},{once:true});
}
function buildCharBtns(){
  var g=document.getElementById('sChars');g.innerHTML='';
  var names=['くるま','しょうぼうしゃ','パトカー','うさぎ','ねこ','パンダ'];
  for(var i=0;i<CHARS.length;i++){
    var b=document.createElement('button');b.className='cb';b.innerHTML=CHARS[i]+'<span>'+names[i]+'</span>';
    (function(ch,bt){bt.onclick=function(){setupCh=ch;var bs=document.querySelectorAll('#sChars .cb');for(var j=0;j<bs.length;j++)bs[j].classList.remove('sel');bt.classList.add('sel');chkSetup();};})(CHARS[i],b);
    g.appendChild(b);
  }
}
var setupCh='';
function chkSetup(){document.getElementById('sGo').disabled=!(document.getElementById('sName').value.trim()&&setupCh);}
function finishSetup(){
  var n=document.getElementById('sName').value.trim();if(!n||!setupCh)return;
  var p={id:uid(),name:n,char:setupCh,points:0,mDone:''};
  D.players.push(p);D.currentId=p.id;save();
  document.getElementById('setup').style.display='none';document.getElementById('main').style.display='flex';renderAll();
  ensureAudio();if(!D.muteB)startBGM();
}

// ===== Render =====
function renderAll(){
  var p=cur();if(!p)return;
  document.getElementById('tC').textContent=p.char;
  document.getElementById('tN').textContent=p.name;
  document.getElementById('tP').textContent=p.points;
  var pct=Math.min(100,Math.round((p.points/D.target)*100));
  var bar=document.getElementById('pBar');bar.style.width=pct+'%';bar.textContent=pct+'%';
  renderBoard();renderChores();renderMorn();
  document.getElementById('uBtn').disabled=p.points<=0;
  undoP=false;document.getElementById('uMsg').style.display='none';
}
function renderBoard(){
  var p=cur();if(!p)return;var bd=document.getElementById('board');bd.innerHTML='';
  var tot=D.target,cols=5,rows=Math.ceil(tot/cols),cells=[];
  for(var r=0;r<rows;r++){var rw=[];for(var c=0;c<cols;c++){var i=r*cols+c;rw.push(i<tot?i+1:null);}if(r%2===1)rw.reverse();for(var j=0;j<rw.length;j++)cells.push(rw[j]);}
  for(var k=0;k<cells.length;k++){
    var num=cells[k],el=document.createElement('div');el.className='cell';
    if(num===null){el.classList.add('future');}
    else if(num===p.points+1&&p.points<tot){el.classList.add('current');el.innerHTML=p.char;}
    else if(num===tot){el.classList.add(p.points>=tot?'done':'goal');el.innerHTML='<span class="cn">'+num+'</span>\uD83C\uDFC6';}
    else if(num<=p.points){el.classList.add('done');el.innerHTML='<span class="cn">'+num+'</span>✅';}
    else if(num%10===0&&num<tot){el.classList.add('milestone');el.innerHTML='<span class="cn">'+num+'</span>⭐<span class="ml">'+msLabel(num,tot)+'</span>';}
    else{el.classList.add('future');el.innerHTML='<span class="cn">'+num+'</span>';}
    bd.appendChild(el);
  }
}
function renderChores(){
  var g=document.getElementById('choreGrid');g.innerHTML='';
  var p=cur();var atGoal=p&&p.points>=D.target;
  for(var i=0;i<D.chores.length;i++){
    var ch=D.chores[i],d=document.createElement('div');d.className='chore';
    if(atGoal)d.style.opacity='.4';
    d.innerHTML='<span class="ce">'+ch.emoji+'</span><span class="cn2">'+ch.name+'</span><span class="badge">+'+ch.pt+'</span>';
    if(!atGoal)(function(c){d.onclick=function(){addPt(c);};})(ch);
    g.appendChild(d);
  }
}
function renderMorn(){
  var p=cur();if(!p)return;
  var today=new Date().toISOString().slice(0,10),now=new Date(),nm=now.getHours()*60+now.getMinutes();
  var sm=D.mStart.h*60+D.mStart.m,em=D.mEnd.h*60+D.mEnd.m,ok=nm>=sm&&nm<=em;
  var sh=String(D.mStart.h).padStart(2,'0'),smn=String(D.mStart.m).padStart(2,'0');
  var eh=String(D.mEnd.h).padStart(2,'0'),emn=String(D.mEnd.m).padStart(2,'0');
  document.getElementById('mTime').textContent=sh+':'+smn+'\u301C'+eh+':'+emn;
  var btn=document.getElementById('mBtn'),st=document.getElementById('mStat');
  if(p.mDone===today){btn.disabled=true;st.textContent='✅ クリアずみ！';}
  else if(!ok){btn.disabled=true;st.textContent='⏰ じかんがいだよ';}
  else{btn.disabled=false;st.textContent='\uD83C\uDF1F チャンス！';}
}

// ===== Actions =====
function addPt(chore){
  var p=cur();if(!p||p.points>=D.target)return;
  var old=p.points;p.points=Math.min(D.target,p.points+chore.pt);save();renderAll();
  seTap(chore.pt);showAnim('+'+chore.pt+' '+chore.name+'!','plus');
  for(var ms=Math.floor(old/10)*10+10;ms<=p.points&&ms<D.target;ms+=10){(function(mm){setTimeout(function(){showToast(mm,D.target);seMilestone();},500);})(ms);}
  if(p.points>=D.target)setTimeout(function(){showGoal();},700);
}
function undoPoint(){
  var p=cur();if(!p||p.points<=0)return;
  if(!undoP){undoP=true;document.getElementById('uMsg').style.display='inline';clearTimeout(undoT);undoT=setTimeout(function(){undoP=false;document.getElementById('uMsg').style.display='none';},2500);return;}
  undoP=false;document.getElementById('uMsg').style.display='none';p.points--;save();renderAll();seUndo();showAnim('-1','minus');
}
function mornChallenge(){
  var p=cur();if(!p)return;var today=new Date().toISOString().slice(0,10);if(p.mDone===today)return;
  p.mDone=today;var old=p.points;p.points=Math.min(D.target,p.points+2);save();renderAll();seTap(2);showAnim('+2 あさチャレンジ!','plus');
  for(var ms=Math.floor(old/10)*10+10;ms<=p.points&&ms<D.target;ms+=10){(function(mm){setTimeout(function(){showToast(mm,D.target);seMilestone();},500);})(ms);}
  if(p.points>=D.target)setTimeout(function(){showGoal();},700);
}
function showAnim(txt,cls){var el=document.createElement('div');el.className='pt-anim '+cls;el.textContent=txt;el.style.left=(window.innerWidth/2-60)+'px';el.style.top=(window.innerHeight/2-20)+'px';document.body.appendChild(el);setTimeout(function(){el.remove();},1400);}

// ===== Goal =====
function showGoal(){
  seGoal();showConfetti();var p=cur();
  document.getElementById('mw').innerHTML='<div class="mo" onclick="if(event.target===this)closeM()"><div class="md"><h2>\uD83C\uDF89 ゴール！！\uD83C\uDF89</h2><div class="be">'+p.char+'</div><p><b>'+p.name+'</b> が <b>'+D.target+'ポイント</b> たっせい！</p><p>すごいね！よく がんばったね！</p><button onclick="closeM()">やったー！</button></div></div>';
}
function closeM(){document.getElementById('mw').innerHTML='';}
function showConfetti(){var w=document.createElement('div');w.className='cfw';var cs=['#FF5722','#FF9800','#4CAF50','#2196F3','#9C27B0','#FFC107','#E91E63'];for(var i=0;i<70;i++){var c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'%';c.style.background=cs[Math.floor(Math.random()*cs.length)];c.style.animationDelay=(Math.random()*2)+'s';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.width=(7+Math.random()*7)+'px';c.style.height=(7+Math.random()*7)+'px';w.appendChild(c);}document.body.appendChild(w);setTimeout(function(){w.remove();},5000);}

// ===== Player Switcher =====
function showSwitch(){
  var h='<div class="mo" onclick="if(event.target===this)closeM()"><div class="md"><h2>\uD83D\uDC65 きりかえ</h2><ul class="pl">';
  for(var i=0;i<D.players.length;i++){var p=D.players[i];h+='<li class="'+(p.id===D.currentId?'cur':'')+'\" onclick="swP(\''+p.id+'\')"><span class="pc">'+p.char+'</span><span class="pn">'+p.name+'</span><span class="pp">'+p.points+'pt</span></li>';}
  h+='</ul><button onclick="closeM()">とじる</button></div></div>';document.getElementById('mw').innerHTML=h;
}
function swP(id){D.currentId=id;save();closeM();renderAll();}

// ===== Settings =====
function showSettings(){
  var h='<div class="mo" onclick="if(event.target===this)closeM()"><div class="md" style="text-align:left;max-width:520px">';
  h+='<h2 style="text-align:center">⚙️ せってい</h2>';
  // Players
  h+='<div class="scard"><h3>\uD83D\uDC65 さんかしゃ</h3><div id="spList"></div><button class="abtn" onclick="showAddP()">＋ ついか</button></div>';
  // Target
  h+='<div class="scard"><h3>\uD83C\uDFAF もくひょう</h3><div class="sw"><input type="range" id="trS" min="10" max="100" step="5" value="'+D.target+'" oninput="updT(this.value)"><span class="sv" id="trV">'+D.target+'</span></div></div>';
  // Morning
  h+='<div class="scard"><h3>☀️ あさチャレンジ じかん</h3><div class="ts">かいし <select id="msH" onchange="saveMT()"></select>じ<select id="msM" onchange="saveMT()"></select>ふん</div><div class="ts">おわり <select id="meH" onchange="saveMT()"></select>じ<select id="meM" onchange="saveMT()"></select>ふん</div></div>';
  // Chores
  h+='<div class="scard"><h3>⭐ おてつだい かんり</h3><div id="ceList"></div>';
  h+='<div class="add-chore-row"><select id="acE">';for(var i=0;i<EMOJIS.length;i++)h+='<option>'+EMOJIS[i]+'</option>';
  h+='</select><input id="acN" placeholder="なまえ" maxlength="12"><select id="acP"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>pt<button class="abtn" style="width:auto;padding:6px 14px" onclick="addChore()">＋</button></div></div>';
  // Character
  h+='<div class="scard"><h3>\uD83C\uDFAD キャラクター</h3><div class="cg" id="sCCg" style="justify-items:center"></div></div>';
  // Audio
  h+='<div class="scard"><h3>\uD83C\uDFB5 おと</h3><div class="toggle-row"><span>BGM</span><div class="toggle'+(D.muteB?'':' on')+'" onclick="togB(this)"></div></div><div class="toggle-row"><span>こうかおん</span><div class="toggle'+(D.muteS?'':' on')+'" onclick="togS(this)"></div></div></div>';
  // Reset
  h+='<div class="scard"><h3>\uD83D\uDD04 リセット</h3><button class="rbtn" onclick="confReset()">ポイントを リセット</button></div>';
  h+='<div style="text-align:center"><button onclick="closeM()">とじる</button></div></div></div>';
  document.getElementById('mw').innerHTML=h;
  // Populate
  buildSPL();buildSCCg();buildCEList();initTSel();
}
function buildSPL(){
  var w=document.getElementById('spList');if(!w)return;w.innerHTML='';
  for(var i=0;i<D.players.length;i++){var p=D.players[i];var d=document.createElement('div');d.className='ce-item';d.innerHTML='<span class="ce-emoji">'+p.char+'</span><span class="ce-name">'+p.name+'</span><span class="ce-pt">'+p.points+'pt</span>'+(D.players.length>1?'<button class="db" onclick="delP(\''+p.id+'\')">✕</button>':'');w.appendChild(d);}
}
function buildSCCg(){
  var g=document.getElementById('sCCg');if(!g)return;g.innerHTML='';
  var names=['くるま','しょうぼうしゃ','パトカー','うさぎ','ねこ','パンダ'];
  for(var i=0;i<CHARS.length;i++){var b=document.createElement('button');b.className='cb';b.style.cssText='width:70px;height:70px;font-size:2em;';b.innerHTML=CHARS[i]+'<span>'+names[i]+'</span>';(function(ch){b.onclick=function(){var p=cur();if(p){p.char=ch;save();renderAll();showSettings();}};})(CHARS[i]);g.appendChild(b);}
}
function buildCEList(){
  var w=document.getElementById('ceList');if(!w)return;w.innerHTML='';
  for(var i=0;i<D.chores.length;i++){var ch=D.chores[i];var d=document.createElement('div');d.className='ce-item';d.innerHTML='<span class="ce-emoji">'+ch.emoji+'</span><span class="ce-name">'+ch.name+'</span><span class="ce-pt">+'+ch.pt+'pt</span><button class="db" onclick="delChore('+i+')">✕</button>';w.appendChild(d);}
}
function addChore(){
  var e=document.getElementById('acE').value,n=document.getElementById('acN').value.trim(),p=parseInt(document.getElementById('acP').value);
  if(!n){alert('なまえを いれてね');return;}D.chores.push({emoji:e,name:n,pt:p});save();buildCEList();renderChores();
}
function delChore(i){if(D.chores.length<=1)return;D.chores.splice(i,1);save();buildCEList();renderChores();}
function initTSel(){
  var ids=[['msH','meH'],['msM','meM']];
  for(var h=0;h<=23;h++){for(var x=0;x<2;x++){var s=document.getElementById(ids[0][x]);if(s){var o=document.createElement('option');o.value=h;o.textContent=h;s.appendChild(o);}}}
  for(var m=0;m<=55;m+=5){for(var y=0;y<2;y++){var s2=document.getElementById(ids[1][y]);if(s2){var o2=document.createElement('option');o2.value=m;o2.textContent=String(m).padStart(2,'0');s2.appendChild(o2);}}}
  var a=document.getElementById('msH');if(a)a.value=D.mStart.h;
  var b=document.getElementById('msM');if(b)b.value=D.mStart.m;
  var c=document.getElementById('meH');if(c)c.value=D.mEnd.h;
  var d=document.getElementById('meM');if(d)d.value=D.mEnd.m;
}
function saveMT(){D.mStart.h=parseInt(document.getElementById('msH').value);D.mStart.m=parseInt(document.getElementById('msM').value);D.mEnd.h=parseInt(document.getElementById('meH').value);D.mEnd.m=parseInt(document.getElementById('meM').value);save();renderMorn();}
function updT(v){D.target=parseInt(v);var e=document.getElementById('trV');if(e)e.textContent=v;save();renderAll();}
function togB(el){D.muteB=!D.muteB;if(D.muteB){el.classList.remove('on');stopBGM();}else{el.classList.add('on');startBGM();}save();}
function togS(el){D.muteS=!D.muteS;if(D.muteS)el.classList.remove('on');else el.classList.add('on');save();}
function confReset(){
  document.getElementById('mw').innerHTML='<div class="mo"><div class="md"><h2>⚠️ リセット</h2><div class="be">\uD83D\uDD04</div><p>ポイントを <b>0</b> に もどすよ。いいかな？</p><div class="cbts"><button class="yb" onclick="doReset()">リセット</button><button class="nb" onclick="showSettings()">やめる</button></div></div></div>';
}
function doReset(){var p=cur();if(p){p.points=0;p.mDone='';}save();closeM();renderAll();}
function showAddP(){
  var h='<div class="mo"><div class="md"><h2>＋ ついか</h2><input type="text" class="ni" id="apN" placeholder="なまえ" maxlength="10" style="margin:8px 0"><div class="cg" id="apC" style="justify-items:center"></div><div class="cbts"><button class="gb" onclick="doAddP()">ついか</button><button class="nb" onclick="showSettings()">やめる</button></div></div></div>';
  document.getElementById('mw').innerHTML=h;
  var g=document.getElementById('apC'),names=['くるま','しょうぼうしゃ','パトカー','うさぎ','ねこ','パンダ'];
  for(var i=0;i<CHARS.length;i++){var b=document.createElement('button');b.className='cb';b.style.cssText='width:70px;height:70px;font-size:2em;';b.innerHTML=CHARS[i]+'<span>'+names[i]+'</span>';(function(ch,bt){bt.onclick=function(){addPCh=ch;var bs=document.querySelectorAll('#apC .cb');for(var j=0;j<bs.length;j++)bs[j].classList.remove('sel');bt.classList.add('sel');};})(CHARS[i],b);g.appendChild(b);}
}
var addPCh='';
function doAddP(){var n=document.getElementById('apN').value.trim();if(!n||!addPCh){alert('なまえと キャラクターを えらんでね');return;}var p={id:uid(),name:n,char:addPCh,points:0,mDone:''};D.players.push(p);D.currentId=p.id;addPCh='';save();closeM();renderAll();}
function delP(id){
  var p=null;for(var i=0;i<D.players.length;i++)if(D.players[i].id===id)p=D.players[i];if(!p)return;
  document.getElementById('mw').innerHTML='<div class="mo"><div class="md"><h2>⚠️ さくじょ</h2><div class="be">'+p.char+'</div><p><b>'+p.name+'</b> を さくじょ？</p><div class="cbts"><button class="yb" onclick="doDelP(\''+id+'\')">さくじょ</button><button class="nb" onclick="showSettings()">やめる</button></div></div></div>';
}
function doDelP(id){D.players=D.players.filter(function(p){return p.id!==id;});if(D.currentId===id)D.currentId=D.players.length?D.players[0].id:null;save();if(!D.players.length)location.reload();else{closeM();renderAll();}}

// ===== SW =====
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
init();
</script>
</body>
</html>
