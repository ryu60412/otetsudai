<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おてつだい">
<meta name="theme-color" content="#FF9800">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>おてつだいポイント</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;}
body{background:linear-gradient(135deg,#FFF8E1 0%,#FFECB3 100%);display:flex;flex-direction:column;}

/* ===== Character Select Screen ===== */
#charSelect{position:fixed;inset:0;background:linear-gradient(135deg,#E1F5FE,#FFF8E1);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#charSelect h1{font-size:2.2em;color:#E65100;}
#charSelect p{font-size:1.3em;color:#555;}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:10px;}
.char-btn{font-size:2.8em;width:110px;height:110px;border:4px solid #FFB74D;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.char-btn span{font-size:.35em;margin-top:4px;}
.char-btn:active{transform:scale(.9);background:#FFF3E0;}

/* ===== Main App ===== */
#app{display:none;flex:1;flex-direction:column;overflow:hidden;}
.tab-content{flex:1;overflow-y:auto;padding:16px 16px 10px;-webkit-overflow-scrolling:touch;}
.tab-page{display:none;}
.tab-page.active{display:block;}

/* ===== Top Bar ===== */
.topbar{background:linear-gradient(90deg,#FF9800,#FFA726);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.topbar .char{font-size:2em;}
.topbar .label{font-size:1.1em;font-weight:bold;}
.topbar .pts{font-size:2em;font-weight:bold;}

/* ===== Board ===== */
.board-section{margin:10px 0;}
.board-section h2{text-align:center;font-size:1.3em;color:#E65100;margin-bottom:10px;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:500px;margin:0 auto;}
.cell{width:100%;aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:bold;position:relative;transition:all .3s;border:3px solid transparent;}
.cell.normal{background:#FFF9C4;color:#F57F17;border-color:#FFF176;}
.cell.special{background:linear-gradient(135deg,#FFAB91,#FF8A65);color:#fff;border-color:#FF7043;animation:sparkle 2s infinite;}
.cell.done{background:#C8E6C9;color:#388E3C;border-color:#81C784;}
.cell.current{background:linear-gradient(135deg,#42A5F5,#1E88E5);color:#fff;border-color:#1565C0;animation:pulse 1s infinite;font-size:2em;box-shadow:0 0 15px rgba(33,150,243,.5);}
.cell.goal{background:linear-gradient(135deg,#FFD54F,#FFC107);color:#E65100;border-color:#FFB300;font-size:1.8em;}
.cell.future{background:#FAFAFA;color:#BDBDBD;border-color:#E0E0E0;}
.cell .num{position:absolute;top:3px;left:6px;font-size:.45em;opacity:.6;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes sparkle{0%,100%{box-shadow:0 0 5px rgba(255,112,67,.3);}50%{box-shadow:0 0 15px rgba(255,112,67,.6);}}

/* ===== Progress Bar ===== */
.progress-wrap{margin:16px 0;background:#fff;border-radius:20px;height:32px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.1);}
.progress-bar{height:100%;background:linear-gradient(90deg,#66BB6A,#43A047);border-radius:20px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-weight:bold;font-size:.9em;min-width:40px;}

/* ===== Big Button ===== */
.big-btn-wrap{text-align:center;margin:18px 0;}
.big-btn{width:85%;max-width:400px;padding:22px;font-size:1.8em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF7043,#F4511E);border:none;border-radius:60px;cursor:pointer;box-shadow:0 6px 20px rgba(244,81,30,.4);transition:all .15s;-webkit-tap-highlight-color:transparent;}
.big-btn:active{transform:scale(.94);box-shadow:0 2px 8px rgba(244,81,30,.3);}
.big-btn:disabled{background:#ccc;box-shadow:none;}

/* ===== Point Animation ===== */
.pt-anim{position:fixed;font-size:2.5em;font-weight:bold;color:#FF5722;pointer-events:none;z-index:999;animation:floatUp 1.2s ease forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-120px) scale(1.5);}}

/* ===== Morning Challenge ===== */
.morning-card{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-radius:20px;padding:24px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.1);}
.morning-card h2{color:#1565C0;font-size:1.6em;margin-bottom:12px;}
.morning-card .emoji{font-size:4em;margin:10px 0;}
.morning-card p{font-size:1.15em;color:#333;margin:8px 0;line-height:1.6;}
.morning-btn{width:80%;max-width:350px;padding:18px;font-size:1.5em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#42A5F5,#1E88E5);border:none;border-radius:50px;cursor:pointer;margin-top:16px;box-shadow:0 4px 15px rgba(30,136,229,.4);transition:all .15s;}
.morning-btn:active{transform:scale(.94);}
.morning-btn:disabled{background:#B0BEC5;box-shadow:none;}
.morning-status{margin-top:14px;font-size:1.1em;color:#1565C0;font-weight:bold;}

/* ===== Settings ===== */
.settings-card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.settings-card h3{color:#E65100;font-size:1.3em;margin-bottom:14px;}
.settings-card label{display:block;font-size:1.1em;color:#555;margin-bottom:8px;}
.slider-wrap{display:flex;align-items:center;gap:12px;}
.slider-wrap input[type=range]{flex:1;height:8px;-webkit-appearance:none;background:#FFE0B2;border-radius:4px;outline:none;}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#FF9800;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;}
.slider-val{font-size:1.6em;font-weight:bold;color:#E65100;min-width:50px;text-align:center;}
.reset-btn{width:100%;padding:16px;font-size:1.3em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#ef5350,#e53935);border:none;border-radius:14px;cursor:pointer;margin-top:8px;box-shadow:0 3px 10px rgba(229,57,53,.3);}
.reset-btn:active{transform:scale(.96);}

/* ===== Tab Nav ===== */
.tab-nav{display:flex;background:#fff;border-top:2px solid #eee;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.tab-nav button{flex:1;padding:12px 0 10px;border:none;background:none;font-size:1em;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent;}
.tab-nav button.active{color:#FF9800;font-weight:bold;}
.tab-nav button .icon{font-size:1.6em;}

/* ===== Confetti ===== */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:2000;overflow:hidden;}
.confetti{position:absolute;width:12px;height:12px;border-radius:2px;animation:confettiFall 3s ease-in forwards;}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ===== Goal Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:28px;padding:36px 28px;text-align:center;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:modalIn .4s ease;}
@keyframes modalIn{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.modal h2{font-size:2em;color:#E65100;margin-bottom:10px;}
.modal .big-emoji{font-size:5em;margin:10px 0;}
.modal p{font-size:1.2em;color:#555;margin:8px 0;}
.modal button{margin-top:16px;padding:14px 40px;font-size:1.3em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#66BB6A,#43A047);border:none;border-radius:40px;cursor:pointer;}

/* ===== Confirm Dialog ===== */
.confirm-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}
.confirm-btns button{padding:12px 30px;font-size:1.2em;font-weight:bold;border:none;border-radius:30px;cursor:pointer;}
.confirm-btns .yes{background:#ef5350;color:#fff;}
.confirm-btns .no{background:#E0E0E0;color:#555;}

.hidden{display:none!important;}
</style>
</head>
<body>

<!-- ===== Character Select ===== -->
<div id="charSelect">
  <h1>🌟 おてつだいポイント 🌟</h1>
  <p>キャラクターを えらんでね！</p>
  <div class="char-grid">
    <button class="char-btn" onclick="selectChar('🚗')">🚗<span>くるま</span></button>
    <button class="char-btn" onclick="selectChar('🚒')">🚒<span>しょうぼうしゃ</span></button>
    <button class="char-btn" onclick="selectChar('🚓')">🚓<span>パトカー</span></button>
    <button class="char-btn" onclick="selectChar('🐰')">🐰<span>うさぎ</span></button>
    <button class="char-btn" onclick="selectChar('🐱')">🐱<span>ねこ</span></button>
    <button class="char-btn" onclick="selectChar('🐼')">🐼<span>パンダ</span></button>
  </div>
</div>

<!-- ===== Main App ===== -->
<div id="app">
  <div class="topbar">
    <span class="char" id="topChar">🐰</span>
    <span class="label">ポイント</span>
    <span class="pts" id="topPts">0</span>
  </div>

  <div class="tab-content">
    <!-- Home Tab -->
    <div class="tab-page active" id="pageHome">
      <div class="progress-wrap"><div class="progress-bar" id="progBar" style="width:0%">0%</div></div>
      <div class="board-section">
        <h2>🗺️ ぼうけんマップ</h2>
        <div class="board" id="board"></div>
      </div>
      <div class="big-btn-wrap">
        <button class="big-btn" id="helpBtn" onclick="addPoint()">⭐ おてつだい したよ！</button>
      </div>
    </div>

    <!-- Morning Tab -->
    <div class="tab-page" id="pageMorning">
      <div class="morning-card">
        <h2>☀️ あさチャレンジ</h2>
        <div class="emoji">🌅</div>
        <p>あさ <b>6:00〜7:30</b> のあいだに<br>おきたら ボーナス <b>+2ポイント！</b></p>
        <p>はやおきは いいことだね！</p>
        <button class="morning-btn" id="morningBtn" onclick="morningChallenge()">☀️ おきたよ！（+2）</button>
        <div class="morning-status" id="morningStatus"></div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-page" id="pageSettings">
      <div class="settings-card">
        <h3>🎯 もくひょうポイント</h3>
        <label>ゴールまでの ポイントすう</label>
        <div class="slider-wrap">
          <input type="range" id="targetSlider" min="10" max="100" step="5" value="30" oninput="updateTarget(this.value)">
          <span class="slider-val" id="targetVal">30</span>
        </div>
      </div>
      <div class="settings-card">
        <h3>🎭 キャラクター へんこう</h3>
        <div class="char-grid" style="justify-items:center;">
          <button class="char-btn" onclick="changeChar('🚗')">🚗<span>くるま</span></button>
          <button class="char-btn" onclick="changeChar('🚒')">🚒<span>しょうぼうしゃ</span></button>
          <button class="char-btn" onclick="changeChar('🚓')">🚓<span>パトカー</span></button>
          <button class="char-btn" onclick="changeChar('🐰')">🐰<span>うさぎ</span></button>
          <button class="char-btn" onclick="changeChar('🐱')">🐱<span>ねこ</span></button>
          <button class="char-btn" onclick="changeChar('🐼')">🐼<span>パンダ</span></button>
        </div>
      </div>
      <div class="settings-card">
        <h3>🔄 リセット</h3>
        <button class="reset-btn" onclick="confirmReset()">ポイントを リセットする</button>
      </div>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-nav">
    <button class="active" onclick="switchTab('pageHome',this)"><span class="icon">🏠</span>ホーム</button>
    <button onclick="switchTab('pageMorning',this)"><span class="icon">☀️</span>あさチャレンジ</button>
    <button onclick="switchTab('pageSettings',this)"><span class="icon">⚙️</span>せってい</button>
  </div>
</div>

<!-- Modal Container -->
<div id="modalWrap"></div>

<script>
// ===== State =====
let state = {
  char: '', points: 0, target: 30,
  morningDone: '', // date string e.g. "2026-05-22"
};

// ===== Init =====
function init() {
  const saved = localStorage.getItem('otetsudai');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) {}
  }
  if (state.char) {
    document.getElementById('charSelect').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    renderAll();
  }
}

function save() {
  localStorage.setItem('otetsudai', JSON.stringify(state));
}

// ===== Character Select =====
function selectChar(c) {
  state.char = c;
  save();
  document.getElementById('charSelect').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  renderAll();
}

function changeChar(c) {
  state.char = c;
  save();
  renderAll();
}

// ===== Render =====
function renderAll() {
  document.getElementById('topChar').textContent = state.char;
  document.getElementById('topPts').textContent = state.points;
  document.getElementById('targetSlider').value = state.target;
  document.getElementById('targetVal').textContent = state.target;

  // Progress bar
  const pct = Math.min(100, Math.round((state.points / state.target) * 100));
  const bar = document.getElementById('progBar');
  bar.style.width = pct + '%';
  bar.textContent = pct + '%';

  // Board
  renderBoard();

  // Morning
  renderMorning();

  // Disable help btn if goal reached
  document.getElementById('helpBtn').disabled = state.points >= state.target;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const total = state.target;
  const cols = 5;
  const rows = Math.ceil(total / cols);
  const cells = [];

  // Create cells in serpentine order
  for (let r = 0; r < rows; r++) {
    const rowCells = [];
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (idx < total) rowCells.push(idx + 1);
      else rowCells.push(null);
    }
    // Reverse odd rows for serpentine
    if (r % 2 === 1) rowCells.reverse();
    cells.push(...rowCells);
  }

  cells.forEach((num, i) => {
    const el = document.createElement('div');
    el.className = 'cell';
    if (num === null) {
      el.classList.add('future');
      el.innerHTML = '';
    } else if (num === state.points + 1 && state.points < total) {
      el.classList.add('current');
      el.innerHTML = state.char;
    } else if (num === total) {
      el.classList.add(state.points >= total ? 'done' : 'goal');
      el.innerHTML = '<span class="num">' + num + '</span>🏆';
    } else if (num <= state.points) {
      el.classList.add('done');
      el.innerHTML = '<span class="num">' + num + '</span>✅';
    } else if (num % 5 === 0 || num % 7 === 0) {
      el.classList.add('special');
      el.innerHTML = '<span class="num">' + num + '</span>⭐';
    } else {
      el.classList.add('future');
      el.innerHTML = '<span class="num">' + num + '</span>';
    }
    board.appendChild(el);
  });
}

function renderMorning() {
  const today = new Date().toISOString().slice(0, 10);
  const btn = document.getElementById('morningBtn');
  const status = document.getElementById('morningStatus');
  const h = new Date().getHours();
  const m = new Date().getMinutes();
  const timeOk = (h === 6) || (h === 7 && m <= 30);

  if (state.morningDone === today) {
    btn.disabled = true;
    status.textContent = '✅ きょうは もうクリアしたよ！すごい！';
  } else if (!timeOk) {
    btn.disabled = true;
    status.textContent = '⏰ あさ 6:00〜7:30 に チャレンジしてね';
  } else {
    btn.disabled = false;
    status.textContent = '🌟 いまが チャンスだよ！';
  }
}

// ===== Actions =====
function addPoint() {
  if (state.points >= state.target) return;
  state.points++;
  save();
  renderAll();
  showPointAnim('+1');

  if (state.points >= state.target) {
    setTimeout(() => showGoalModal(), 600);
  }
}

function morningChallenge() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.morningDone === today) return;
  state.morningDone = today;
  state.points = Math.min(state.target, state.points + 2);
  save();
  renderAll();
  showPointAnim('+2');

  if (state.points >= state.target) {
    setTimeout(() => showGoalModal(), 600);
  }
}

function showPointAnim(text) {
  const el = document.createElement('div');
  el.className = 'pt-anim';
  el.textContent = text;
  el.style.left = (window.innerWidth / 2 - 30) + 'px';
  el.style.top = (window.innerHeight / 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ===== Goal Modal =====
function showGoalModal() {
  showConfetti();
  const wrap = document.getElementById('modalWrap');
  wrap.innerHTML = '<div class="modal-overlay" onclick="event.target===this&&closeModal()"><div class="modal">' +
    '<h2>🎉 ゴール！！🎉</h2>' +
    '<div class="big-emoji">' + state.char + '</div>' +
    '<p><b>' + state.target + 'ポイント</b> たっせい！</p>' +
    '<p>すごいね！よく がんばったね！</p>' +
    '<button onclick="closeModal()">やったー！</button>' +
    '</div></div>';
}

function closeModal() {
  document.getElementById('modalWrap').innerHTML = '';
}

// ===== Confetti =====
function showConfetti() {
  const wrap = document.createElement('div');
  wrap.className = 'confetti-wrap';
  const colors = ['#FF5722','#FF9800','#4CAF50','#2196F3','#9C27B0','#FFC107','#E91E63'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = (Math.random() * 2) + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.width = (8 + Math.random() * 8) + 'px';
    c.style.height = (8 + Math.random() * 8) + 'px';
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 5000);
}

// ===== Settings =====
function updateTarget(v) {
  state.target = parseInt(v);
  document.getElementById('targetVal').textContent = v;
  save();
  renderAll();
}

function confirmReset() {
  const wrap = document.getElementById('modalWrap');
  wrap.innerHTML = '<div class="modal-overlay"><div class="modal">' +
    '<h2>⚠️ リセット</h2>' +
    '<div class="big-emoji">🔄</div>' +
    '<p>ポイントを <b>0</b> に もどすよ。<br>ほんとうに いいかな？</p>' +
    '<div class="confirm-btns">' +
    '<button class="yes" onclick="doReset()">リセットする</button>' +
    '<button class="no" onclick="closeModal()">やめる</button>' +
    '</div></div></div>';
}

function doReset() {
  state.points = 0;
  state.morningDone = '';
  save();
  closeModal();
  renderAll();
}

// ===== Tab Navigation =====
function switchTab(pageId, btn) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (pageId === 'pageMorning') renderMorning();
}

// ===== Service Worker Registration =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ===== Start =====
init();
</script>
</body>
</html>
