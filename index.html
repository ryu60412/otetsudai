<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おてつだい">
<meta name="theme-color" content="#FF9800">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>おてつだいポイント</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;}
body{background:linear-gradient(135deg,#FFF8E1 0%,#FFECB3 100%);display:flex;flex-direction:column;}

/* ===== Setup Screen ===== */
#setupScreen{position:fixed;inset:0;background:linear-gradient(135deg,#E1F5FE,#FFF8E1);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
#setupScreen h1{font-size:2em;color:#E65100;}
#setupScreen p{font-size:1.2em;color:#555;}
.name-input{font-size:1.4em;padding:14px 20px;border:3px solid #FFB74D;border-radius:16px;text-align:center;width:80%;max-width:320px;outline:none;background:#fff;}
.name-input:focus{border-color:#FF9800;box-shadow:0 0 10px rgba(255,152,0,.3);}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:8px;}
.char-btn{font-size:2.6em;width:100px;height:100px;border:4px solid #FFB74D;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.char-btn span{font-size:.33em;margin-top:3px;}
.char-btn:active,.char-btn.selected{transform:scale(.93);background:#FFF3E0;border-color:#FF9800;}
.char-btn.selected{border-width:5px;box-shadow:0 0 15px rgba(255,152,0,.4);}
.setup-go{padding:16px 50px;font-size:1.5em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF7043,#F4511E);border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 15px rgba(244,81,30,.4);transition:all .15s;margin-top:8px;}
.setup-go:active{transform:scale(.94);}
.setup-go:disabled{background:#ccc;box-shadow:none;}

/* ===== Main App ===== */
#app{display:none;flex:1;flex-direction:column;overflow:hidden;}
.tab-content{flex:1;overflow-y:auto;padding:14px 14px 10px;-webkit-overflow-scrolling:touch;}
.tab-page{display:none;}
.tab-page.active{display:block;}

/* ===== Top Bar ===== */
.topbar{background:linear-gradient(90deg,#FF9800,#FFA726);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.topbar .char{font-size:1.8em;}
.topbar .name{font-size:1em;font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .pts-label{font-size:.85em;opacity:.9;}
.topbar .pts{font-size:1.8em;font-weight:bold;}
.switch-btn{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:.85em;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-weight:bold;}
.switch-btn:active{background:rgba(255,255,255,.4);}

/* ===== Player List ===== */
.player-list{list-style:none;padding:0;margin:10px 0;}
.player-list li{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:8px 0;background:#FFF8E1;border-radius:14px;font-size:1.15em;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.player-list li:active{background:#FFE0B2;}
.player-list li.current{border-color:#FF9800;background:#FFF3E0;}
.player-list li .p-char{font-size:1.6em;}
.player-list li .p-name{flex:1;font-weight:bold;}
.player-list li .p-pts{color:#E65100;font-weight:bold;}

/* ===== Board ===== */
.board-section{margin:8px 0;}
.board-section h2{text-align:center;font-size:1.2em;color:#E65100;margin-bottom:8px;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:480px;margin:0 auto;}
.cell{width:100%;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.3em;font-weight:bold;position:relative;transition:all .3s;border:3px solid transparent;line-height:1.1;}
.cell.done{background:#C8E6C9;color:#388E3C;border-color:#81C784;}
.cell.current{background:linear-gradient(135deg,#42A5F5,#1E88E5);color:#fff;border-color:#1565C0;animation:pulse 1s infinite;font-size:1.6em;box-shadow:0 0 12px rgba(33,150,243,.5);}
.cell.goal{background:linear-gradient(135deg,#FFD54F,#FFC107);color:#E65100;border-color:#FFB300;font-size:1.5em;}
.cell.milestone{background:linear-gradient(135deg,#FFD54F,#FFAB00);color:#E65100;border-color:#FF8F00;animation:sparkle 2s infinite;}
.cell.milestone .ms-label{font-size:.28em;margin-top:1px;opacity:.85;white-space:nowrap;}
.cell.future{background:#FAFAFA;color:#BDBDBD;border-color:#E0E0E0;}
.cell .num{position:absolute;top:2px;left:5px;font-size:.4em;opacity:.6;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
@keyframes sparkle{0%,100%{box-shadow:0 0 5px rgba(255,143,0,.3);}50%{box-shadow:0 0 15px rgba(255,143,0,.6);}}

/* ===== Progress Bar ===== */
.progress-wrap{margin:12px 0;background:#fff;border-radius:18px;height:28px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.1);}
.progress-bar{height:100%;background:linear-gradient(90deg,#66BB6A,#43A047);border-radius:18px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-weight:bold;font-size:.85em;min-width:36px;}

/* ===== Buttons ===== */
.btn-area{text-align:center;margin:14px 0;display:flex;flex-direction:column;align-items:center;gap:10px;}
.big-btn{width:85%;max-width:380px;padding:20px;font-size:1.6em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF7043,#F4511E);border:none;border-radius:55px;cursor:pointer;box-shadow:0 5px 18px rgba(244,81,30,.4);transition:all .15s;-webkit-tap-highlight-color:transparent;}
.big-btn:active{transform:scale(.94);box-shadow:0 2px 8px rgba(244,81,30,.3);}
.big-btn:disabled{background:#ccc;box-shadow:none;}
.undo-btn{width:55%;max-width:240px;padding:12px;font-size:1.1em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#78909C,#546E7A);border:none;border-radius:40px;cursor:pointer;box-shadow:0 3px 10px rgba(84,110,122,.3);transition:all .15s;}
.undo-btn:active{transform:scale(.94);}
.undo-btn:disabled{background:#ccc;box-shadow:none;}
.undo-confirm{color:#EF5350;font-size:.95em;font-weight:bold;animation:blink .6s 3;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ===== Point Animation ===== */
.pt-anim{position:fixed;font-size:2.3em;font-weight:bold;pointer-events:none;z-index:999;animation:floatUp 1.1s ease forwards;}
.pt-anim.plus{color:#FF5722;}
.pt-anim.minus{color:#1E88E5;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-110px) scale(1.4);}}

/* ===== Milestone Toast ===== */
.milestone-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(60px);background:linear-gradient(135deg,#FFF8E1,#FFE082);border:3px solid #FFB300;border-radius:22px;padding:16px 28px;text-align:center;z-index:1800;box-shadow:0 8px 30px rgba(255,143,0,.35);animation:toastIn .4s ease forwards;min-width:260px;max-width:85%;}
.milestone-toast.out{animation:toastOut .4s ease forwards;}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(60px) scale(.8);}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes toastOut{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.9);}}
.milestone-toast .mt-char{font-size:2.5em;}
.milestone-toast .mt-msg{font-size:1.4em;font-weight:bold;color:#E65100;margin-top:4px;}
.milestone-toast .mt-pts{font-size:1em;color:#888;margin-top:2px;}

/* ===== Morning Challenge ===== */
.morning-card{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-radius:20px;padding:22px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.1);}
.morning-card h2{color:#1565C0;font-size:1.5em;margin-bottom:10px;}
.morning-card .emoji{font-size:3.5em;margin:8px 0;}
.morning-card p{font-size:1.1em;color:#333;margin:6px 0;line-height:1.5;}
.morning-card .time-display{font-size:1.4em;font-weight:bold;color:#1565C0;margin:8px 0;background:#fff;display:inline-block;padding:8px 20px;border-radius:12px;}
.morning-btn{width:78%;max-width:340px;padding:16px;font-size:1.4em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#42A5F5,#1E88E5);border:none;border-radius:50px;cursor:pointer;margin-top:14px;box-shadow:0 4px 15px rgba(30,136,229,.4);transition:all .15s;}
.morning-btn:active{transform:scale(.94);}
.morning-btn:disabled{background:#B0BEC5;box-shadow:none;}
.morning-status{margin-top:12px;font-size:1.05em;color:#1565C0;font-weight:bold;}

/* ===== Settings ===== */
.settings-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.settings-card h3{color:#E65100;font-size:1.2em;margin-bottom:12px;}
.settings-card label{display:block;font-size:1.05em;color:#555;margin-bottom:6px;}
.slider-wrap{display:flex;align-items:center;gap:10px;}
.slider-wrap input[type=range]{flex:1;height:8px;-webkit-appearance:none;background:#FFE0B2;border-radius:4px;outline:none;}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#FF9800;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;}
.slider-val{font-size:1.5em;font-weight:bold;color:#E65100;min-width:45px;text-align:center;}
.time-setting{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap;}
.time-setting select{font-size:1.15em;padding:8px 12px;border:2px solid #BBDEFB;border-radius:10px;background:#fff;color:#333;}
.time-setting span{font-size:1.1em;color:#555;}
.reset-btn{width:100%;padding:14px;font-size:1.2em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#ef5350,#e53935);border:none;border-radius:14px;cursor:pointer;margin-top:6px;box-shadow:0 3px 10px rgba(229,57,53,.3);}
.reset-btn:active{transform:scale(.96);}
.add-player-btn{width:100%;padding:14px;font-size:1.2em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#66BB6A,#43A047);border:none;border-radius:14px;cursor:pointer;box-shadow:0 3px 10px rgba(67,160,71,.3);}
.add-player-btn:active{transform:scale(.96);}
.del-btn{background:#ef5350;color:#fff;border:none;padding:6px 14px;border-radius:10px;font-size:.9em;cursor:pointer;font-weight:bold;}

/* ===== Tab Nav ===== */
.tab-nav{display:flex;background:#fff;border-top:2px solid #eee;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.tab-nav button{flex:1;padding:10px 0 8px;border:none;background:none;font-size:.92em;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s;-webkit-tap-highlight-color:transparent;}
.tab-nav button.active{color:#FF9800;font-weight:bold;}
.tab-nav button .icon{font-size:1.5em;}

/* ===== Confetti ===== */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:2000;overflow:hidden;}
.confetti{position:absolute;width:12px;height:12px;border-radius:2px;animation:confettiFall 3s ease-in forwards;}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ===== Modals ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:24px;padding:30px 24px;text-align:center;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:modalIn .35s ease;max-height:85vh;overflow-y:auto;}
@keyframes modalIn{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.modal h2{font-size:1.7em;color:#E65100;margin-bottom:8px;}
.modal .big-emoji{font-size:4.5em;margin:8px 0;}
.modal p{font-size:1.1em;color:#555;margin:6px 0;}
.modal button{margin-top:12px;padding:12px 36px;font-size:1.2em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#66BB6A,#43A047);border:none;border-radius:36px;cursor:pointer;}
.confirm-btns{display:flex;gap:12px;justify-content:center;margin-top:14px;}
.confirm-btns button{padding:12px 28px;font-size:1.15em;font-weight:bold;border:none;border-radius:28px;cursor:pointer;}
.confirm-btns .yes{background:#ef5350;color:#fff;}
.confirm-btns .no{background:#E0E0E0;color:#555;}
.hidden{display:none!important;}
</style>
</head>
<body>

<!-- ===== Setup Screen ===== -->
<div id="setupScreen">
  <h1>&#x1F31F; おてつだいポイント &#x1F31F;</h1>
  <p>なまえと キャラクターを えらんでね！</p>
  <input type="text" class="name-input" id="setupName" placeholder="なまえを いれてね" maxlength="10">
  <div class="char-grid" id="setupChars">
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F697;')">&#x1F697;<span>くるま</span></button>
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F692;')">&#x1F692;<span>しょうぼうしゃ</span></button>
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F693;')">&#x1F693;<span>パトカー</span></button>
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F430;')">&#x1F430;<span>うさぎ</span></button>
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F431;')">&#x1F431;<span>ねこ</span></button>
    <button class="char-btn" onclick="pickSetupChar(this,'&#x1F43C;')">&#x1F43C;<span>パンダ</span></button>
  </div>
  <button class="setup-go" id="setupGo" onclick="finishSetup()" disabled>はじめる！</button>
</div>

<!-- ===== Main App ===== -->
<div id="app">
  <div class="topbar">
    <span class="char" id="topChar">&#x1F430;</span>
    <span class="name" id="topName">なまえ</span>
    <span class="pts-label">ポイント</span>
    <span class="pts" id="topPts">0</span>
    <button class="switch-btn" onclick="showPlayerSwitcher()">&#x1F465;きりかえ</button>
  </div>
  <div class="tab-content">
    <div class="tab-page active" id="pageHome">
      <div class="progress-wrap"><div class="progress-bar" id="progBar" style="width:0%">0%</div></div>
      <div class="board-section">
        <h2>&#x1F5FA;&#xFE0F; ぼうけんマップ</h2>
        <div class="board" id="board"></div>
      </div>
      <div class="btn-area">
        <button class="big-btn" id="helpBtn" onclick="addPoint()">⭐ おてつだい したよ！</button>
        <button class="undo-btn" id="undoBtn" onclick="undoPoint()">⏪ もどす（-1）</button>
        <div class="undo-confirm hidden" id="undoMsg">もういちど タップで もどすよ</div>
      </div>
    </div>
    <div class="tab-page" id="pageMorning">
      <div class="morning-card">
        <h2>☀️ あさチャレンジ</h2>
        <div class="emoji">&#x1F305;</div>
        <p>きめた じかんに おきたら<br>ボーナス <b>+2ポイント！</b></p>
        <div class="time-display" id="morningTimeDisplay">6:00〜7:30</div>
        <p>はやおきは いいことだね！</p>
        <button class="morning-btn" id="morningBtn" onclick="morningChallenge()">☀️ おきたよ！（+2）</button>
        <div class="morning-status" id="morningStatus"></div>
      </div>
    </div>
    <div class="tab-page" id="pageSettings">
      <div class="settings-card">
        <h3>&#x1F465; さんかしゃ</h3>
        <div id="settingsPlayerList"></div>
        <button class="add-player-btn" onclick="showAddPlayer()">＋ さんかしゃを ついか</button>
      </div>
      <div class="settings-card">
        <h3>&#x1F3AF; もくひょうポイント</h3>
        <label>ゴールまでの ポイントすう</label>
        <div class="slider-wrap">
          <input type="range" id="targetSlider" min="10" max="100" step="5" value="30" oninput="updateTarget(this.value)">
          <span class="slider-val" id="targetVal">30</span>
        </div>
      </div>
      <div class="settings-card">
        <h3>☀️ あさチャレンジの じかん</h3>
        <label>かいし じかん</label>
        <div class="time-setting">
          <select id="mStartH" onchange="saveMorningTime()"></select><span>じ</span>
          <select id="mStartM" onchange="saveMorningTime()"></select><span>ふん</span>
        </div>
        <label>おわり じかん</label>
        <div class="time-setting">
          <select id="mEndH" onchange="saveMorningTime()"></select><span>じ</span>
          <select id="mEndM" onchange="saveMorningTime()"></select><span>ふん</span>
        </div>
      </div>
      <div class="settings-card">
        <h3>&#x1F3AD; キャラクター へんこう</h3>
        <div class="char-grid" style="justify-items:center;">
          <button class="char-btn" onclick="changeChar('&#x1F697;')">&#x1F697;<span>くるま</span></button>
          <button class="char-btn" onclick="changeChar('&#x1F692;')">&#x1F692;<span>しょうぼうしゃ</span></button>
          <button class="char-btn" onclick="changeChar('&#x1F693;')">&#x1F693;<span>パトカー</span></button>
          <button class="char-btn" onclick="changeChar('&#x1F430;')">&#x1F430;<span>うさぎ</span></button>
          <button class="char-btn" onclick="changeChar('&#x1F431;')">&#x1F431;<span>ねこ</span></button>
          <button class="char-btn" onclick="changeChar('&#x1F43C;')">&#x1F43C;<span>パンダ</span></button>
        </div>
      </div>
      <div class="settings-card">
        <h3>&#x1F504; リセット</h3>
        <button class="reset-btn" onclick="confirmReset()">ポイントを リセットする</button>
      </div>
    </div>
  </div>
  <div class="tab-nav">
    <button class="active" onclick="switchTab('pageHome',this)"><span class="icon">&#x1F3E0;</span>ホーム</button>
    <button onclick="switchTab('pageMorning',this)"><span class="icon">☀️</span>あさチャレンジ</button>
    <button onclick="switchTab('pageSettings',this)"><span class="icon">⚙️</span>せってい</button>
  </div>
</div>

<div id="modalWrap"></div>

<script>
// ===== Data =====
var data={players:[],currentId:null,target:30,morningStart:{h:6,m:0},morningEnd:{h:7,m:30}};
var undoPending=false,undoTimer=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cur(){return data.players.find(function(p){return p.id===data.currentId;})||null;}
function save(){localStorage.setItem('otetsudai3',JSON.stringify(data));}
function load(){var s=localStorage.getItem('otetsudai3');if(s){try{data=JSON.parse(s);}catch(e){}}}

// ===== Milestone Messages =====
function getMilestoneMsg(pts,target){
  var remaining=target-pts;
  if(remaining<=10&&remaining>0) return {msg:'あとちょっと！',emoji:'\uD83D\uDCA8'};
  if(remaining<=0) return null;
  var msgs={
    10:{msg:'いいかんじ！',emoji:'\uD83C\uDF1F'},
    20:{msg:'がんばってるね！',emoji:'\uD83D\uDCAA'},
    30:{msg:'すごいぞ！',emoji:'⭐'},
    40:{msg:'えらい！',emoji:'\uD83D\uDC4F'},
    50:{msg:'はんぶん すぎたよ！',emoji:'\uD83C\uDFAF'},
    60:{msg:'もっと いけるよ！',emoji:'\uD83D\uDD25'},
    70:{msg:'あとちょっと！',emoji:'\uD83D\uDCA8'},
    80:{msg:'もうすぐ ゴール！',emoji:'\uD83C\uDFC1'},
    90:{msg:'ラストスパート！',emoji:'\uD83D\uDE80'}
  };
  if(msgs[pts]) return msgs[pts];
  return {msg:'その ちょうし！',emoji:'✨'};
}

function getMilestoneBoardLabel(cellNum,target){
  var remaining=target-cellNum;
  if(remaining<=10&&remaining>0) return 'あとちょっと';
  var labels={10:'いいかんじ',20:'がんばれ',30:'すごい',40:'えらい',50:'はんぶん',60:'いけるよ',70:'あとすこし',80:'もうすぐ',90:'ラスト'};
  return labels[cellNum]||'ファイト';
}

function showMilestoneToast(pts,target){
  var info=getMilestoneMsg(pts,target);
  if(!info)return;
  var p=cur();
  var el=document.createElement('div');
  el.className='milestone-toast';
  el.innerHTML='<div class="mt-char">'+(p?p.char:'⭐')+'</div>'
    +'<div class="mt-msg">'+info.emoji+' '+info.msg+' '+info.emoji+'</div>'
    +'<div class="mt-pts">'+pts+'ポイント たっせい！</div>';
  document.body.appendChild(el);
  setTimeout(function(){el.classList.add('out');},2000);
  setTimeout(function(){el.remove();},2500);
}

// ===== Init =====
function init(){
  load();initTimeSelects();
  if(data.players.length>0&&data.currentId){
    document.getElementById('setupScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    renderAll();
  }
}

// ===== Setup =====
var setupChar='';
function pickSetupChar(btn,c){
  setupChar=c;
  var btns=document.querySelectorAll('#setupChars .char-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  btn.classList.add('selected');
  checkSetupReady();
}
function checkSetupReady(){
  document.getElementById('setupGo').disabled=!(document.getElementById('setupName').value.trim()&&setupChar);
}
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('setupName').addEventListener('input',checkSetupReady);
});
function finishSetup(){
  var n=document.getElementById('setupName').value.trim();
  if(!n||!setupChar)return;
  var p={id:uid(),name:n,char:setupChar,points:0,morningDone:''};
  data.players.push(p);data.currentId=p.id;save();
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  renderAll();
}

// ===== Render =====
function renderAll(){
  var p=cur();if(!p)return;
  document.getElementById('topChar').textContent=p.char;
  document.getElementById('topName').textContent=p.name;
  document.getElementById('topPts').textContent=p.points;
  document.getElementById('targetSlider').value=data.target;
  document.getElementById('targetVal').textContent=data.target;
  var pct=Math.min(100,Math.round((p.points/data.target)*100));
  var bar=document.getElementById('progBar');
  bar.style.width=pct+'%';bar.textContent=pct+'%';
  renderBoard();renderMorning();renderSettingsPlayers();loadMorningTimeUI();
  document.getElementById('helpBtn').disabled=p.points>=data.target;
  document.getElementById('undoBtn').disabled=p.points<=0;
  undoPending=false;document.getElementById('undoMsg').classList.add('hidden');
}

function renderBoard(){
  var p=cur();if(!p)return;
  var board=document.getElementById('board');board.innerHTML='';
  var total=data.target,cols=5,rows=Math.ceil(total/cols);
  var cells=[];
  for(var r=0;r<rows;r++){
    var row=[];for(var c=0;c<cols;c++){var i=r*cols+c;row.push(i<total?i+1:null);}
    if(r%2===1)row.reverse();
    for(var j=0;j<row.length;j++) cells.push(row[j]);
  }
  for(var k=0;k<cells.length;k++){
    var num=cells[k];
    var el=document.createElement('div');el.className='cell';
    if(num===null){el.classList.add('future');el.innerHTML='';}
    else if(num===p.points+1&&p.points<total){el.classList.add('current');el.innerHTML=p.char;}
    else if(num===total){
      el.classList.add(p.points>=total?'done':'goal');
      el.innerHTML='<span class="num">'+num+'</span>\uD83C\uDFC6';
    }
    else if(num<=p.points){el.classList.add('done');el.innerHTML='<span class="num">'+num+'</span>✅';}
    else if(num%10===0&&num<total){
      el.classList.add('milestone');
      el.innerHTML='<span class="num">'+num+'</span>⭐<span class="ms-label">'+getMilestoneBoardLabel(num,total)+'</span>';
    }
    else{el.classList.add('future');el.innerHTML='<span class="num">'+num+'</span>';}
    board.appendChild(el);
  }
}

function renderMorning(){
  var p=cur();if(!p)return;
  var today=new Date().toISOString().slice(0,10);
  var btn=document.getElementById('morningBtn');
  var status=document.getElementById('morningStatus');
  var now=new Date(),h=now.getHours(),m=now.getMinutes(),nowMin=h*60+m;
  var startMin=data.morningStart.h*60+data.morningStart.m;
  var endMin=data.morningEnd.h*60+data.morningEnd.m;
  var timeOk=nowMin>=startMin&&nowMin<=endMin;
  var sh=String(data.morningStart.h).padStart(2,'0'),sm=String(data.morningStart.m).padStart(2,'0');
  var eh=String(data.morningEnd.h).padStart(2,'0'),em2=String(data.morningEnd.m).padStart(2,'0');
  document.getElementById('morningTimeDisplay').textContent=sh+':'+sm+'\u301C'+eh+':'+em2;
  if(p.morningDone===today){btn.disabled=true;status.textContent='✅ きょうは もうクリアしたよ！すごい！';}
  else if(!timeOk){btn.disabled=true;status.textContent='⏰ '+sh+':'+sm+'\u301C'+eh+':'+em2+' に チャレンジしてね';}
  else{btn.disabled=false;status.textContent='\uD83C\uDF1F いまが チャンスだよ！';}
}

function renderSettingsPlayers(){
  var wrap=document.getElementById('settingsPlayerList');wrap.innerHTML='';
  for(var i=0;i<data.players.length;i++){
    var p=data.players[i];
    var div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;background:'+(p.id===data.currentId?'#FFF3E0':'#FAFAFA')+';border-radius:12px;border:2px solid '+(p.id===data.currentId?'#FF9800':'transparent')+';';
    div.innerHTML='<span style="font-size:1.5em">'+p.char+'</span><span style="flex:1;font-weight:bold">'+p.name+'</span><span style="color:#E65100;font-weight:bold">'+p.points+'pt</span>'+(data.players.length>1?'<button class="del-btn" onclick="confirmDeletePlayer(\''+p.id+'\')">✕</button>':'');
    wrap.appendChild(div);
  }
}

// ===== Actions =====
function addPoint(){
  var p=cur();if(!p||p.points>=data.target)return;
  p.points++;save();renderAll();showPtAnim('+1','plus');
  if(p.points%10===0&&p.points<data.target){
    setTimeout(function(){showMilestoneToast(p.points,data.target);},500);
  }
  if(p.points>=data.target)setTimeout(function(){showGoalModal();},600);
}

function undoPoint(){
  var p=cur();if(!p||p.points<=0)return;
  if(!undoPending){undoPending=true;document.getElementById('undoMsg').classList.remove('hidden');clearTimeout(undoTimer);undoTimer=setTimeout(function(){undoPending=false;document.getElementById('undoMsg').classList.add('hidden');},2500);return;}
  undoPending=false;document.getElementById('undoMsg').classList.add('hidden');
  p.points--;save();renderAll();showPtAnim('-1','minus');
}

function morningChallenge(){
  var p=cur();if(!p)return;
  var today=new Date().toISOString().slice(0,10);
  if(p.morningDone===today)return;
  p.morningDone=today;
  var oldPts=p.points;
  p.points=Math.min(data.target,p.points+2);
  save();renderAll();showPtAnim('+2','plus');
  var newPts=p.points;
  for(var ms=Math.floor(oldPts/10)*10+10;ms<=newPts&&ms<data.target;ms+=10){
    (function(mm){setTimeout(function(){showMilestoneToast(mm,data.target);},500);})(ms);
  }
  if(p.points>=data.target)setTimeout(function(){showGoalModal();},600);
}

function showPtAnim(text,cls){
  var el=document.createElement('div');el.className='pt-anim '+cls;el.textContent=text;
  el.style.left=(window.innerWidth/2-30)+'px';el.style.top=(window.innerHeight/2)+'px';
  document.body.appendChild(el);setTimeout(function(){el.remove();},1200);
}

// ===== Goal =====
function showGoalModal(){
  showConfetti();var p=cur();
  document.getElementById('modalWrap').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>\uD83C\uDF89 ゴール！！\uD83C\uDF89</h2><div class="big-emoji">'+p.char+'</div><p><b>'+p.name+'</b> が <b>'+data.target+'ポイント</b> たっせい！</p><p>すごいね！よく がんばったね！</p><button onclick="closeModal()">やったー！</button></div></div>';
}
function closeModal(){document.getElementById('modalWrap').innerHTML='';}
function showConfetti(){
  var w=document.createElement('div');w.className='confetti-wrap';
  var colors=['#FF5722','#FF9800','#4CAF50','#2196F3','#9C27B0','#FFC107','#E91E63'];
  for(var i=0;i<80;i++){var c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=(Math.random()*2)+'s';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.width=(8+Math.random()*8)+'px';c.style.height=(8+Math.random()*8)+'px';w.appendChild(c);}
  document.body.appendChild(w);setTimeout(function(){w.remove();},5000);
}

// ===== Player Switcher =====
function showPlayerSwitcher(){
  var html='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>\uD83D\uDC65 さんかしゃ きりかえ</h2><ul class="player-list">';
  for(var i=0;i<data.players.length;i++){
    var p=data.players[i];
    html+='<li class="'+(p.id===data.currentId?'current':'')+'" onclick="switchPlayer(\''+p.id+'\')"><span class="p-char">'+p.char+'</span><span class="p-name">'+p.name+'</span><span class="p-pts">'+p.points+'pt</span></li>';
  }
  html+='</ul><button onclick="closeModal()">とじる</button></div></div>';
  document.getElementById('modalWrap').innerHTML=html;
}
function switchPlayer(id){data.currentId=id;save();closeModal();renderAll();}

// ===== Add/Delete Player =====
var addCharPick='';
function showAddPlayer(){
  addCharPick='';
  document.getElementById('modalWrap').innerHTML='<div class="modal-overlay"><div class="modal"><h2>＋ ついか</h2><input type="text" class="name-input" id="addName" placeholder="なまえを いれてね" maxlength="10" style="margin:10px 0"><div class="char-grid" id="addChars" style="justify-items:center;"><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDE97\')">\uD83D\uDE97<span>くるま</span></button><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDE92\')">\uD83D\uDE92<span>しょうぼうしゃ</span></button><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDE93\')">\uD83D\uDE93<span>パトカー</span></button><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDC30\')">\uD83D\uDC30<span>うさぎ</span></button><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDC31\')">\uD83D\uDC31<span>ねこ</span></button><button class="char-btn" onclick="pickAddChar(this,\'\uD83D\uDC3C\')">\uD83D\uDC3C<span>パンダ</span></button></div><div class="confirm-btns"><button class="yes" style="background:#43A047" onclick="doAddPlayer()">ついか</button><button class="no" onclick="closeModal()">やめる</button></div></div></div>';
}
function pickAddChar(btn,c){
  addCharPick=c;
  var btns=document.querySelectorAll('#addChars .char-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  btn.classList.add('selected');
}
function doAddPlayer(){var n=document.getElementById('addName').value.trim();if(!n||!addCharPick){alert('なまえと キャラクターを えらんでね');return;}var p={id:uid(),name:n,char:addCharPick,points:0,morningDone:''};data.players.push(p);data.currentId=p.id;save();closeModal();renderAll();}

function confirmDeletePlayer(id){
  var p=null;for(var i=0;i<data.players.length;i++){if(data.players[i].id===id){p=data.players[i];break;}}
  if(!p)return;
  document.getElementById('modalWrap').innerHTML='<div class="modal-overlay"><div class="modal"><h2>⚠️ さくじょ</h2><div class="big-emoji">'+p.char+'</div><p><b>'+p.name+'</b> を さくじょするよ。<br>ポイントも きえるよ。いいかな？</p><div class="confirm-btns"><button class="yes" onclick="doDeletePlayer(\''+id+'\')">さくじょする</button><button class="no" onclick="closeModal()">やめる</button></div></div></div>';
}
function doDeletePlayer(id){
  data.players=data.players.filter(function(p){return p.id!==id;});
  if(data.currentId===id)data.currentId=data.players.length?data.players[0].id:null;
  save();closeModal();
  if(!data.players.length){location.reload();}
  else renderAll();
}

// ===== Settings =====
function updateTarget(v){data.target=parseInt(v);document.getElementById('targetVal').textContent=v;save();renderAll();}
function changeChar(c){var p=cur();if(!p)return;p.char=c;save();renderAll();}
function confirmReset(){
  document.getElementById('modalWrap').innerHTML='<div class="modal-overlay"><div class="modal"><h2>⚠️ リセット</h2><div class="big-emoji">\uD83D\uDD04</div><p>いまの さんかしゃの ポイントを<br><b>0</b> に もどすよ。いいかな？</p><div class="confirm-btns"><button class="yes" onclick="doReset()">リセットする</button><button class="no" onclick="closeModal()">やめる</button></div></div></div>';
}
function doReset(){var p=cur();if(p){p.points=0;p.morningDone='';}save();closeModal();renderAll();}

// ===== Morning Time =====
function initTimeSelects(){
  var hIds=['mStartH','mEndH'];
  for(var hi=0;hi<hIds.length;hi++){var sel=document.getElementById(hIds[hi]);for(var h=0;h<=23;h++){var o=document.createElement('option');o.value=h;o.textContent=h;sel.appendChild(o);}}
  var mIds=['mStartM','mEndM'];
  for(var mi=0;mi<mIds.length;mi++){var sel2=document.getElementById(mIds[mi]);for(var m=0;m<=55;m+=5){var o2=document.createElement('option');o2.value=m;o2.textContent=String(m).padStart(2,'0');sel2.appendChild(o2);}}
}
function loadMorningTimeUI(){document.getElementById('mStartH').value=data.morningStart.h;document.getElementById('mStartM').value=data.morningStart.m;document.getElementById('mEndH').value=data.morningEnd.h;document.getElementById('mEndM').value=data.morningEnd.m;}
function saveMorningTime(){data.morningStart.h=parseInt(document.getElementById('mStartH').value);data.morningStart.m=parseInt(document.getElementById('mStartM').value);data.morningEnd.h=parseInt(document.getElementById('mEndH').value);data.morningEnd.m=parseInt(document.getElementById('mEndM').value);save();renderMorning();}

// ===== Tabs =====
function switchTab(pageId,btn){
  var pages=document.querySelectorAll('.tab-page');for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
  document.getElementById(pageId).classList.add('active');
  var btns=document.querySelectorAll('.tab-nav button');for(var j=0;j<btns.length;j++) btns[j].classList.remove('active');
  btn.classList.add('active');
  if(pageId==='pageMorning')renderMorning();
}

// ===== SW =====
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

init();
</script>
